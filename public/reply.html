<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ブースへ返信</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h1 {
      font-size: 1.25rem;
      margin: 0;
      text-align: center;
      color: #334155;
    }

    .status {
      padding: 12px 16px;
      border-radius: 10px;
      background-color: #e2e8f0;
      font-size: 0.95rem;
      text-align: center;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status.is-ok {
      background-color: #dcfce7;
      color: #166534;
    }

    .status.is-error {
      background-color: #fee2e2;
      color: #991b1b;
    }

    .presets {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .preset-btn {
      padding: 14px 16px;
      font-size: 1rem;
      font-weight: 700;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      background-color: #ffffff;
      color: #0f172a;
      cursor: pointer;
      text-align: left;
    }

    .preset-btn:active:not(:disabled) {
      background-color: #f1f5f9;
    }

    .preset-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }

    textarea {
      width: 100%;
      min-height: 90px;
      padding: 12px;
      font-size: 1rem;
      font-family: inherit;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      resize: vertical;
    }

    .send-btn {
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      background-color: #2563eb;
      color: #ffffff;
      cursor: pointer;
    }

    .send-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>ブース画面へ返信</h1>

    <div id="status" class="status">送信するメッセージを選んでください</div>

    <div class="presets">
      <button class="preset-btn" type="button" data-msg="今向かっています！少々お待ちください">
        今向かっています！少々お待ちください
      </button>
      <button class="preset-btn" type="button" data-msg="5分ほどで戻ります！">
        5分ほどで戻ります！
      </button>
      <button class="preset-btn" type="button" data-msg="10分ほどで戻ります！">
        10分ほどで戻ります！
      </button>
    </div>

    <form id="replyForm" class="form">
      <textarea id="customMessage" placeholder="自由文で返信する場合に入力..."></textarea>
      <button id="sendBtn" class="send-btn" type="submit">自由文を送信</button>
    </form>
  </main>

  <script>
    (function () {
      const statusEl = document.getElementById("status");
      const formEl = document.getElementById("replyForm");
      const inputEl = document.getElementById("customMessage");
      const sendBtn = document.getElementById("sendBtn");
      const presetBtns = Array.from(document.querySelectorAll(".preset-btn"));

      let replyTopic = "";

      function setStatus(text, type = "") {
        statusEl.textContent = text;
        statusEl.className = "status" + (type ? " " + type : "");
      }

      function setButtonsDisabled(disabled) {
        sendBtn.disabled = disabled;
        presetBtns.forEach((btn) => {
          btn.disabled = disabled;
        });
      }

      async function loadConfig() {
        try {
          const res = await fetch("/api/config", { cache: "no-store" });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          if (!data.replyTopic) throw new Error("Missing replyTopic");
          replyTopic = data.replyTopic;
        } catch (err) {
          console.error("Config load failed:", err);
          setStatus("設定の読み込みに失敗しました", "is-error");
          setButtonsDisabled(true);
        }
      }

      async function sendReply(message) {
        const trimmed = message.trim();
        if (!trimmed || !replyTopic) return;

        setButtonsDisabled(true);
        setStatus("送信中...");

        try {
          const res = await fetch(`https://ntfy.sh/${encodeURIComponent(replyTopic)}`, {
            method: "POST",
            body: trimmed,
          });
          if (!res.ok) {
            throw new Error(`HTTP ${res.status}`);
          }
          setStatus(`送信しました：「${trimmed}」`, "is-ok");
          inputEl.value = "";
        } catch (err) {
          console.error("Reply send failed:", err);
          setStatus("送信に失敗しました。電波状況を確認してください。", "is-error");
        } finally {
          setButtonsDisabled(false);
        }
      }

      presetBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          sendReply(btn.dataset.msg || "");
        });
      });

      formEl.addEventListener("submit", (e) => {
        e.preventDefault();
        sendReply(inputEl.value);
      });

      loadConfig();
    })();
  </script>
</body>
</html>
